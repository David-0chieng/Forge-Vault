<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>(function(){try{var t=localStorage.getItem('forge-vault-theme');document.documentElement.dataset.theme=t==='light'?'light':'dark';}catch(e){document.documentElement.dataset.theme='dark';}})();</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace — Forge Vault</title>
    <meta name="description" content="Browse every verified part in stock at Forge Vault — sourced worldwide, protected on every order." />
    <meta name="theme-color" content="#0e0f12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body class="min-h-screen">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[60] focus:rounded-full focus:bg-moto-accent focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-moto-on-accent focus:shadow-lg">Skip to main content</a>

    <header data-header="products" class="sticky top-0 z-50 bg-moto-panel border-b border-moto-line"></header>

    <main id="main" class="container-page py-10 sm:py-12">
      <p class="text-[13px] text-moto-outline">
        <a href="/index.html" class="hover:text-moto-ink">Home</a> / Marketplace
      </p>

      <h1 data-products-heading class="mt-3 text-4xl font-bold tracking-tight text-moto-ink">Marketplace</h1>
      <p data-products-count class="mt-2 text-moto-muted">Loading verified parts…</p>

      <form data-search-form role="search" class="mt-8 flex max-w-xl items-center gap-2.5 rounded-full border border-moto-line-2 bg-moto-panel py-2 pl-5 pr-2">
        <label for="search" class="sr-only">Search parts</label>
        <input type="search" id="search" data-search-input name="q" placeholder="Search by VIN, make, model or part number…"
               class="min-w-0 flex-1 bg-transparent text-sm text-moto-ink placeholder:text-moto-outline focus:outline-none" />
        <button type="submit" class="btn-primary py-2.5">Search</button>
      </form>

      <div class="mt-10 grid gap-9 lg:grid-cols-[240px_1fr] lg:items-start">
        <aside aria-label="Filter by category" class="lg:sticky lg:top-24">
          <p class="font-display text-[15px] font-semibold text-moto-ink">Category</p>
          <div data-category-filters class="mt-3.5 flex flex-col gap-1">
            <div class="h-8 w-full animate-pulse rounded-lg bg-moto-high/60"></div>
          </div>
        </aside>

        <div>
          <div class="mb-5 flex items-center justify-between gap-4">
            <p data-results-count class="text-sm text-moto-muted"></p>
            <select data-sort class="w-auto rounded-full border border-moto-line-2 bg-moto-panel px-4 py-2.5 text-sm text-moto-ink focus:border-moto-accent focus:outline-none">
              <option value="newest">Sort: Most recent</option>
              <option value="price-asc">Price: Low to high</option>
              <option value="price-desc">Price: High to low</option>
            </select>
          </div>

          <section aria-label="Parts">
            <div data-products-grid class="grid grid-cols-1 gap-5 sm:grid-cols-2 xl:grid-cols-3"></div>
          </section>
        </div>
      </div>
    </main>

    <footer data-footer class="on-dark bg-black"></footer>

    <script type="module" src="/src/shop.js"></script>
  </body>
</html>
